[project]
name = "panos-mcp"
version = "0.1.0"
description = "Token-efficient MCP server for Palo Alto Networks PAN-OS firewalls and Panorama"
readme = "README.md"
requires-python = ">=3.13"
license = "ISC"
dependencies = [
    # Upper bounds are major-version caps to protect against silent breakage
    # when an upstream ships a 2.0 with API changes. Loosen when an upstream
    # is verified compatible.
    "mcp[cli]>=1.3.0,<2.0",
    "pydantic>=2.10.6,<3.0",
    # pan-os-python is the most volatile dep — its object model is what every
    # config tool calls into. A 2.x release would likely require code changes.
    "pan-os-python>=1.12.0,<2.0",
    # pan-os-python 1.12.x still imports `distutils`, removed in Py 3.12.
    # We shim it from setuptools._distutils in panos_mcp/__init__.py.
    # No upper bound on setuptools — the shim is loose enough to absorb
    # changes in its private _distutils layout.
    "setuptools>=68",
    "httpx>=0.28.1,<1.0",
    "keyring>=25.0,<30",
    "python-dotenv>=1.0.0,<2.0",
    # mcp-toolkit must be installed separately — see README "Quick start".
    # When published to PyPI, add: "mcp-toolkit>=0.1.0,<1.0",
]

[[project.authors]]
name = "Michael Pope"
email = "me@michaelpope.cv"

[project.urls]
Homepage = "https://github.com/epopleachim/panos-mcp-py"
Repository = "https://github.com/epopleachim/panos-mcp-py"
Issues = "https://github.com/epopleachim/panos-mcp-py/issues"

[project.scripts]
panos-mcp = "panos_mcp.server:main"

[project.optional-dependencies]
dev = [
    # Dev-only deps; bounds are looser because breakage here affects
    # contributors rather than end users. Ruff intentionally has no upper
    # bound — we want lint-rule churn to be visible in CI.
    "pytest>=8.0,<11.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<9.0",
    "ruff>=0.6",
    "mypy>=1.10,<2.0",
    "tiktoken>=0.7,<1.0",     # benchmark token counting
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panos_mcp"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# B008: Pydantic frozen models as default args are safe (immutable). The
# Pagination()/Pattern()/etc. defaults from mcp_toolkit are intentional and
# match the FastMCP idiom used across the suite.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# pan-os-python and the MCP SDK don't ship type stubs. We don't want to
# silence type errors in our own code, just stop mypy from complaining
# that those imports are untyped.
[[tool.mypy.overrides]]
module = ["panos.*", "mcp.*", "setuptools", "setuptools.*", "keyring"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live PAN-OS firewall (skipped by default)",
    "benchmark: token-cost measurement, requires tiktoken",
]
