[project]
name = "node804-panos-mcp"
dynamic = ["version"]
description = "Token-efficient MCP server for Palo Alto Networks PAN-OS firewalls and Panorama"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = [
    "mcp",
    "model-context-protocol",
    "panos",
    "pan-os",
    "palo-alto",
    "panorama",
    "firewall",
    "network-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    # Upper bounds are major-version caps to protect against silent breakage
    # when an upstream ships a 2.0 with API changes. Loosen when an upstream
    # is verified compatible.
    "mcp[cli]>=1.3.0,<2.0",
    "pydantic>=2.10.6,<3.0",
    # pan-os-python is the most volatile dep — its object model is what every
    # config tool calls into. A 2.x release would likely require code changes.
    "pan-os-python>=1.12.0,<2.0",
    # pan-os-python 1.12.x still imports `distutils`, removed in Py 3.12.
    # We shim it from setuptools._distutils in panos_mcp/__init__.py.
    # No upper bound on setuptools — the shim is loose enough to absorb
    # changes in its private _distutils layout.
    "setuptools>=68",
    "httpx>=0.28.1,<1.0",
    "keyring>=25.0,<30",
    "python-dotenv>=1.0.0,<2.0",
    # Shared RBAC / TLS / shaping utilities. Published alongside this package.
    "node804-mcp-toolkit>=0.1.0,<1.0",
]

[[project.authors]]
name = "Michael Pope"
email = "me@michaelpope.cv"

[project.urls]
Homepage = "https://github.com/Node804/node804-panos-mcp"
Repository = "https://github.com/Node804/node804-panos-mcp"
Issues = "https://github.com/Node804/node804-panos-mcp/issues"

[project.scripts]
node804-panos-mcp = "panos_mcp.server:main"
node804-panos-mcp-setup = "panos_mcp.setup:main"

[project.optional-dependencies]
dev = [
    # Dev-only deps; bounds are looser because breakage here affects
    # contributors rather than end users.
    "pytest>=8.0,<11.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<9.0",
    # Ruff is pinned to an exact version so local, pre-commit, and CI all
    # format and lint identically. A floating range let an older local ruff
    # wrap code differently than CI's, which failed `ruff format --check`.
    # Bump this and the rev in .pre-commit-config.yaml together.
    "ruff==0.15.13",
    "mypy>=1.10,<2.0",
    "tiktoken>=0.7,<1.0",     # benchmark token counting
    # Runs the git hooks in .pre-commit-config.yaml.
    "pre-commit>=3.5,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/panos_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/panos_mcp"]

# Bundle the panos-engineer skill inside the wheel so the setup wizard can
# install it offline (copied in from the repo-root skills/ tree at build time).
[tool.hatch.build.targets.wheel.force-include]
"skills/panos-engineer" = "panos_mcp/skills/panos-engineer"

[tool.hatch.build.targets.sdist]
# Keep generated reports, local agent settings, and CI scaffolding out of the
# source distribution; ship only what's needed to build and test the package.
exclude = ["report", ".claude", ".github", ".mypy_cache", ".ruff_cache"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# '×' (U+00D7) is used intentionally as the multiplication sign in cost
# docstrings (e.g. "DGs × rule-types × 2 roundtrips"); don't flag it as an
# ambiguous look-alike for 'x'.
allowed-confusables = ["×"]
# B008: Pydantic frozen models as default args are safe (immutable). The
# Pagination()/Pattern()/etc. defaults from node804_mcp_toolkit are intentional
# and match the FastMCP idiom used across the suite.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

# pan-os-python and the MCP SDK don't ship type stubs. We don't want to
# silence type errors in our own code, just stop mypy from complaining
# that those imports are untyped.
[[tool.mypy.overrides]]
module = ["panos.*", "pan.*", "mcp.*", "setuptools", "setuptools.*", "keyring"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live PAN-OS firewall (skipped by default)",
    "benchmark: token-cost measurement, requires tiktoken",
]
