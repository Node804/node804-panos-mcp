name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install mcp-toolkit from PyPI when available, or from a known source
      # repo otherwise. Adjust the MCP_TOOLKIT_REPO env var (or repo secret)
      # if the toolkit lives elsewhere.
      - name: Install mcp-toolkit
        env:
          MCP_TOOLKIT_REPO: ${{ vars.MCP_TOOLKIT_REPO || 'epopleachim/mcp-toolkit-py' }}
        run: |
          python -m pip install --upgrade pip
          # Try PyPI first; fall back to a git install from the configured repo.
          pip install mcp-toolkit || pip install "git+https://github.com/${MCP_TOOLKIT_REPO}.git"
      - name: Install panos-mcp
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -v -m "not integration and not benchmark"
