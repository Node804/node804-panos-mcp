name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dependencies
        # node804-mcp-toolkit is a declared dependency, so it resolves from
        # PyPI automatically. While it is not yet published, pre-install it
        # from the source repo as a fallback so CI is not blocked.
        env:
          MCP_TOOLKIT_REPO: ${{ vars.MCP_TOOLKIT_REPO || 'Node804/node804-mcp-toolkit' }}
        run: |
          python -m pip install --upgrade pip
          pip install node804-mcp-toolkit \
            || pip install "git+https://github.com/${MCP_TOOLKIT_REPO}.git"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest -v -m "not integration and not benchmark"
